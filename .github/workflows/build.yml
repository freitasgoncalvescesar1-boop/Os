name: Build OS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso

      - name: Build
        run: |
          set -eux

          mkdir -p build/iso/boot/grub

          gcc \
            -m64 \
            -ffreestanding \
            -fno-pie \
            -fno-stack-protector \
            -mno-red-zone \
            -nostdlib \
            -Wall \
            -Wextra \
            -c src/kernel.c \
            -o build/kernel.o

          as \
            --64 \
            src/entry.S \
            -o build/entry.o

          ld \
            -m elf_x86_64 \
            -T linker.ld \
            -o build/iso/boot/kernel.elf \
            build/entry.o \
            build/kernel.o

          grub-file \
            --is-x86-multiboot2 \
            build/iso/boot/kernel.elf

          cp boot/grub/grub.cfg build/iso/boot/grub/grub.cfg

          grub-mkrescue \
            -o build/OS.iso \
            build/iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: OS-ISO
          path: build/OS.iso
